<main class="shell">
  <div class="card">

    <!-- CHROME -->
    <div class="card-chrome" id="card-chrome">
      <button type="button" class="cdots" id="cli-toggle-dots" aria-label="Toggle CLI view">
        <span class="cdot" style="background:#ff5f57;"></span>
        <span class="cdot" style="background:#febc2e;"></span>
        <span class="cdot" style="background:#28c840;"></span>
      </button>
      <span class="chrome-label" id="chrome-label"></span>
      <div class="chrome-right">
        <button class="view-toggle" id="view-toggle-btn"
          aria-controls="portfolio-view term-view" aria-pressed="false">CLI</button>
      </div>
    </div>

    <div class="card-body">

      <!-- PORTFOLIO VIEW -->
      <div class="view visible" id="portfolio-view">

        <div class="row-top">
          <div>
            <h1 class="name" id="hero-name"></h1>
            <div class="tagline" id="hero-tagline"></div>
          </div>
          <div class="header-right">
            <div class="social-row" id="hero-links"></div>
          </div>
        </div>

        <div class="rule"></div>
        <p class="bio" id="hero-bio"></p>

        <div class="bottom-split">

          <!-- LEFT: skills + certs -->
          <div class="left-col">
            <h2 class="visually-hidden">Skills and certifications</h2>
            <div class="skill-groups" id="skill-groups"></div>
            <div class="certs-section" id="certs-section"></div>
          </div>

          <div class="vdivider"></div>

          <!-- RIGHT: project list / expanded -->
          <div class="right-col">
            <h2 class="visually-hidden">Selected projects</h2>
            <div class="proj-content">

              <div class="proj-panel p-visible" id="proj-list-panel">
                <div id="proj-list"></div>
              </div>

              <div class="proj-panel p-hidden" id="proj-exp-panel" role="region" aria-labelledby="exp-title">
                <div class="proj-exp-inner">
                  <button class="proj-exp-close" id="proj-exp-close-btn"
                    aria-label="Close project detail">✕</button>
                  <h2 class="proj-exp-title" id="exp-title"></h2>
                  <div class="proj-exp-desc"  id="exp-desc"></div>
                  <div class="proj-exp-tags"  id="exp-tags"></div>
                  <div id="exp-link"></div>
                </div>
              </div>

            </div>
            <div class="proj-footer" id="proj-footer"></div>
          </div>

        </div>
      </div><!-- /portfolio-view -->

      <!-- CLI VIEW -->
      <div class="view hidden" id="term-view">
        <div class="term-inner" id="term-lines"></div>
        <div class="tinput-wrap">
          <span class="tprompt" id="term-prompt"></span>
          <input class="tinput" id="term-input"
            aria-label="Terminal command input"
            placeholder="type a command…"/>
        </div>
      </div>

    </div>
  </div>
</main>


</body>
</html>
