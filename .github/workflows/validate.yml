name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run site smoke tests
        run: python3 -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::215550999357:role/personal-site-github-deploy
          aws-region: us-east-2
          role-session-name: personal-site-${{ github.run_id }}
      - name: Upload approved site files
        run: >-
          aws s3 sync . s3://ericfurspan-site-215550999357/
          --exclude "*"
          --include "index.html"
          --include "robots.txt"
          --include "assets/*"
          --delete
      - name: Refresh CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id E2UTUQ7WMGXRMJ
          --paths "/*"
